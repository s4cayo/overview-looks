<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Products · List</title>
<!--@HEADFONTS-->
<style>
/*@BASECSS*/
/*@PANELCSS*/
/*@TABSCSS*/
/*@NAVCSS*/
/*@PV2CSS*/
/*@COMMONCSS*/
/* ===== Products B — ranked list + detail pane ===== */
/* glance: four plain numbers that are also the filters */
.pb-glance{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--pv2-line);border-bottom:1px solid var(--pv2-line)}
.pb-g{display:flex;flex-direction:column;gap:4px;padding:16px 18px;text-align:left;position:relative;border-radius:0;transition:background .2s}
.pb-g + .pb-g{border-left:1px solid var(--pv2-line)}
.pb-g:hover{background:var(--pv2-bg2)}
.pb-g span{font-size:13px;color:var(--pv2-mut);display:flex;align-items:center;gap:7px}
.pb-g span i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.pb-g b{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.pb-g small{font-size:12.5px;color:var(--pv2-mut)}
.pb-g[aria-pressed="true"]{background:color-mix(in srgb,var(--pv2-acc) 10%,transparent)}
.pb-g[aria-pressed="true"]::after{content:"";position:absolute;left:18px;right:18px;bottom:-1px;height:3px;border-radius:3px;background:linear-gradient(90deg,#7c3fc1,#a275e0)}
@media (max-width:760px){.pb-glance{grid-template-columns:repeat(2,minmax(0,1fr))}.pb-g:nth-child(3){border-left:0}.pb-g:nth-child(n+3){border-top:1px solid var(--pv2-line)}.pb-g{padding:14px 12px}.pb-g b{font-size:24px}}

.pb-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:18px;align-items:start}
@media (max-width:1179px){.pb-wrap{grid-template-columns:minmax(0,1fr)}.pb-pane{display:none!important}}
.pb-list{container-type:inline-size}
.pb-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.pb-tools .ip-search{flex:1 1 240px}
.pb-filt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--pv2-mut);margin:4px 0 6px;min-height:26px}
.pb-filt b{color:var(--pv2-fg);font-weight:600}
.pb-filt button{color:var(--pv2-acc);font-weight:600}
.pb-rows{display:flex;flex-direction:column}
.pb-row{display:grid;grid-template-columns:26px 44px minmax(0,1fr) 170px 150px;gap:14px;align-items:center;width:100%;padding:12px 10px;border-radius:14px;text-align:left;border-top:1px solid var(--pv2-line);transition:background .2s,box-shadow .2s}
.pb-row:first-child{border-top-color:transparent}
.pb-row:hover{background:var(--pv2-bg2)}
.pb-row[aria-current="true"]{background:color-mix(in srgb,var(--pv2-acc) 11%,transparent);box-shadow:inset 3px 0 0 var(--pv2-acc);border-top-color:transparent}
.pb-row[aria-current="true"] + .pb-row{border-top-color:transparent}
.pb-rk{font-size:13px;font-weight:700;color:var(--pv2-mut);text-align:center}
.pb-nm{display:flex;flex-direction:column;gap:4px;min-width:0}
.pb-nm b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-nm small{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--pv2-mut)}
.pb-mini{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:3px;align-items:end}
.pb-mini > span{display:flex;flex-direction:column;align-items:center;gap:3px}
.pb-mini i{display:block;width:100%;height:22px;border-radius:4px;background:var(--pv2-track);position:relative;overflow:hidden}
.pb-mini i::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--v);background:var(--c);border-radius:4px 4px 2px 2px}
.pb-mini em{font-style:normal;font-size:12px;color:var(--pv2-mut);line-height:1}
.pb-mini .t em{color:var(--pv2-fg);font-weight:700}
.pb-v{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0}
.pb-v b{font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.pb-v b small{font-size:12px;font-weight:500;color:var(--pv2-mut);margin-right:4px}
.pb-v b.r{color:var(--pv2-bad)}.pb-v b.u{color:var(--pv2-mut)}
.pb-v > small{font-size:12.5px;color:var(--pv2-mut);white-space:nowrap}
@container (max-width:720px){.pb-row{grid-template-columns:22px 44px minmax(0,1fr) auto;gap:12px;padding:12px 6px}.pb-mini{display:none}}
@container (max-width:420px){.pb-row{grid-template-columns:40px minmax(0,1fr) auto;gap:10px}.pb-rk{display:none}.pb-row .ip-th{width:40px;height:40px}.pb-v b{font-size:16px}.pb-nm b{font-size:14px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}}

.pb-pane{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;overscroll-behavior:contain;padding:22px 24px;display:flex;flex-direction:column;gap:22px;scrollbar-width:thin}
.pb-pane [data-ip-close],.pb-pane .pv2-grab{display:none}

/* sizes: one quiet line per size */
.pb-sztbl{width:100%;border-collapse:collapse;font-size:14px}
.pb-sztbl th{font-size:12.5px;font-weight:500;color:var(--pv2-mut);text-align:right;padding:0 0 8px;white-space:nowrap}
.pb-sztbl th:first-child,.pb-sztbl td:first-child{text-align:left}
.pb-sztbl td{padding:10px 0;border-top:1px solid var(--pv2-line);text-align:right;white-space:nowrap}
.pb-sztbl td:first-child{font-weight:600;width:60px}
.pb-sztbl td.bar{width:42%;padding-left:16px;padding-right:16px}
.pb-sztbl .pa-bar{display:block;height:8px;border-radius:99px;background:var(--pv2-track);overflow:hidden}
.pb-sztbl .pa-bar i{display:block;height:100%;width:var(--w);border-radius:99px;background:linear-gradient(90deg,#550da6,#a275e0)}
.pb-sztbl tr.top td:first-child{color:var(--pv2-acc)}
.pb-sztbl td.r{color:var(--pv2-bad);font-weight:600}
@media (max-width:600px){.pb-sztbl td.bar{width:30%;padding-left:10px;padding-right:10px}.pb-sztbl{font-size:13.5px}}
</style>
<script>
/*@PERJS*/
</script>
</head>
<body data-page="products">
<!--@SPRITE-->
<div class="app">
<!--@SIDE-->
  <div class="content">
  <main>
<!--@NAVTOP-->
    <div class="pv2 ip" id="ip">
      <header class="ip-head">
        <div><h1>Products</h1><p id="pb-count"></p></div>
        <div class="ip-hl"><a class="ip-link" href="#" data-ip-go="inventory">Inventory <svg class="ip-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
      </header>

      <div class="pb-glance" role="group" aria-label="Show products" id="pb-glance"></div>

      <div class="pb-wrap">
        <section class="pv2-panel pb-list" aria-labelledby="pb-h" id="pb-list">
          <div class="pv2-ph"><h3 id="pb-h">Ranked by <span id="pb-by">revenue</span></h3></div>
          <div class="pb-tools">
            <label class="ip-search"><svg class="ip-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <span class="sr">Search products</span><input type="search" id="pb-q" placeholder="Search name, colour or type" autocomplete="off"></label>
            <div class="pv2-sort" role="group" aria-label="Rank products by"><span class="pv2-sind" aria-hidden="true"></span>
              <button type="button" data-s="rev" aria-pressed="true">Revenue</button><button type="button" data-s="profit" aria-pressed="false">Profit</button><button type="button" data-s="margin" aria-pressed="false">Margin</button><button type="button" data-s="units" aria-pressed="false">Units</button><button type="button" data-s="ret" aria-pressed="false">Returns</button>
            </div>
          </div>
          <p class="pb-filt" id="pb-filt" aria-live="polite"></p>
          <div class="pb-rows" id="pb-rows"></div>
        </section>
        <aside class="pv2-panel pb-pane" id="pb-pane" aria-label="Product details" aria-live="polite"></aside>
      </div>

      <section class="pv2-panel" aria-labelledby="pb-sz-h">
        <div class="pv2-ph"><h3 id="pb-sz-h">Sizes across all products</h3><span class="pv2-per" id="pb-szsub"></span></div>
        <table class="pb-sztbl"><thead><tr><th>Size</th><th>Sold</th><th class="bar"><span class="sr">Share</span></th><th>Came back</th></tr></thead><tbody id="pb-sz"></tbody></table>
      </section>
    </div>
  </main>
  </div>
</div>
<!--@DOCK-->
<script>
/*@NAVJS*/
</script>
<script>
/*@DATAJS*/
/*@COMMONJS*/
/* ===== Products B behaviour ===== */
(function(){
  var U=IPU,$=U.$,$$=U.$$,fmt=IP.fmt,PR=IP.PR;
  var st={view:'rev',f:'all',q:'',sel:null};
  var wide=matchMedia('(min-width:1180px)');
  var G=[
    {k:'all',l:'Products',c:'var(--pv2-acc)',n:function(){return PR.length},s:function(){return PR.reduce(function(a,p){return a+p.sizes.length},0)+' sizes in Shopify'},t:function(){return true}},
    {k:'nocost',l:'Profit unknown',c:'var(--pv2-warn)',n:null,s:function(){return 'No unit cost in Shopify'},t:function(p){return !!p.costMissing}},
    {k:'ret',l:'High returns',c:'var(--pv2-bad)',n:null,s:function(){return '15% or more came back'},t:function(p){return p.P.s>=IP.MIN_SHIP&&p.P.rate>=15}},
    {k:'dead',l:'Not selling',c:'var(--pv2-mut)',n:null,s:function(){return 'At most 1 sale in 30 days'},t:function(p){return IP.DEAD.indexOf(p)>=0}}
  ];
  function gl(k){return G.filter(function(g){return g.k===k})[0]}
  function glance(){$('#pb-glance').innerHTML=G.map(function(g){var n=g.n?g.n():PR.filter(g.t).length;
    return '<button type="button" class="pb-g" data-g="'+g.k+'" aria-pressed="'+(st.f===g.k)+'" style="--c:'+g.c+'"><span><i></i>'+g.l+'</span><b>'+n+'</b><small>'+g.s()+'</small></button>'}).join('')}
  function matches(p){var q=st.q.trim().toLowerCase();return gl(st.f).t(p)&&(!q||(p.n+' '+p.col+' '+p.type).toLowerCase().indexOf(q)>=0)}

  function flags(p){
    var d=p.P,out=[],w=IP.worstSize(p);
    if(p.costMissing)out.push('<span class="ip-tag w">No cost</span>');
    if(IP.DEAD.indexOf(p)>=0)out.push('<span class="ip-tag n">Not selling</span>');
    else if(p.left===0&&!p.unknownSizes.length)out.push('<span class="ip-tag r">Sold out</span>');
    else{var k=p.stock.map(function(x,j){return [x,j]}).filter(function(a){return a[0]!=null}).sort(function(a,b){return a[0]-b[0]})[0];
      if(k&&k[0]<=2)out.push('<span class="ip-tag '+(k[0]?'w':'r')+'">'+(k[0]?k[0]+' left · '+p.sizes[k[1]]:p.sizes[k[1]]+' sold out')+'</span>')}
    if(p.unknownSizes.length===p.sizes.length)out.push('<span class="ip-tag n">Stock not tracked</span>');
    if(w>=0&&d.ret[w]/d.ship[w]>=.25)out.push('<span class="ip-tag r">'+p.sizes[w]+' returns '+Math.round(d.ret[w]/d.ship[w]*100)+'%</span>');
    if(!out.length)out.push(p.col+' · '+p.type);
    return out.join('');
  }
  function mini(p){var d=p.P,v=st.view,t=IP.topSize(p),w=IP.worstSize(p),mx=Math.max.apply(0,d.sold);
    return '<span class="pb-mini" aria-hidden="true" style="--n:'+p.sizes.length+'">'+p.sizes.map(function(s,j){var h,c,top;
      if(v==='ret'){var sh=d.ship[j],few=sh<IP.MIN_SHIP,r=sh?d.ret[j]/sh:0;h=!sh?0:few?8:Math.max(8,Math.min(100,r/.5*100));c=few?'rgba(150,140,170,.3)':IP.rateColor(r);top=j===w}
      else{h=mx?d.sold[j]/mx*100:0;top=j===t&&d.u;c=top?'linear-gradient(180deg,#b88cf0,#6a1fc4)':'rgba(162,117,224,.42)'}
      return '<span class="'+(top?'t':'')+'"><i style="--v:'+h+'%;--c:'+c+'"></i><em>'+(p.sizes.length===1?'One size':s)+'</em></span>'}).join('')+'</span>'}
  function value(p){var v=st.view,d=p.P,x=U.val(p,v),unk=(v==='profit'||v==='margin')&&d.profit==null&&d.u;
    if(unk)return '<b class="u">Unknown</b><small>'+d.u+' sold · needs a cost</small>';
    if(v==='ret')return d.s?'<b class="'+(d.rate>=15&&d.s>=IP.MIN_SHIP?'r':'')+'">'+d.rate.toFixed(1)+'%</b><small>'+d.r+' of '+d.s+' came back</small>':'<b class="u">—</b><small>nothing shipped</small>';
    if(!d.u)return '<b class="u">'+(v==='rev'?'<small>EGP</small>0':v==='units'?'0':'—')+'</b><small>'+(p.lastSale?'last sale '+p.lastSale:'no sales')+'</small>';
    if(v==='units')return '<b>'+fmt(d.u)+' sold</b><small>EGP '+fmt(d.rev)+'</small>';
    if(v==='margin')return '<b>'+d.margin.toFixed(1)+'%</b><small>'+(d.profit==null?'profit unknown':'EGP '+fmt(d.profit)+' profit')+'</small>';
    return '<b><small>EGP</small>'+fmt(x)+'</b><small>'+fmt(d.u)+' sold · '+(d.margin==null?'profit unknown':d.margin.toFixed(1)+'%')+'</small>'}
  function rows(){
    var list=U.sorted(PR,st.view).filter(matches);
    $('#pb-rows').innerHTML=list.length?list.map(function(p){var r=U.rankOf(st.view,p);
      return '<button type="button" class="pb-row" data-id="'+p.id+'"'+(st.sel===p&&wide.matches?' aria-current="true"':'')+'><span class="pb-rk">'+(r||'–')+'</span>'+U.sw(p)+'<span class="pb-nm"><b>'+p.n+'</b><small>'+flags(p)+'</small></span>'+mini(p)+'<span class="pb-v">'+value(p)+'</span></button>'}).join('')
      :'<p class="ip-empty">No products match'+(st.q?' “'+st.q.replace(/</g,'')+'”':'')+'.<button type="button" data-clear>Show all products</button></p>';
    var g=gl(st.f);
    $('#pb-filt').innerHTML=st.f==='all'&&!st.q?list.length+' products':'<span>Showing <b>'+list.length+'</b>'+(st.f!=='all'?' · '+g.l.toLowerCase():'')+(st.q?' · “'+st.q.replace(/</g,'')+'”':'')+'</span><button type="button" data-clear>Clear</button>';
    $('#pb-by').textContent=U.VIEW[st.view].toLowerCase()+(st.view==='ret'?' (share that came back)':'');
    if(wide.matches&&(!st.sel||list.indexOf(st.sel)<0)&&list.length){st.sel=list[0];pane();rows()}
  }
  function pane(){if(!st.sel)return;var el=$('#pb-pane'),y=el.scrollTop;el.innerHTML=U.detail(st.sel,st.view);el.scrollTop=y}
  function sizes(){
    var sold=[0,0,0,0,0,0],ship=[0,0,0,0,0,0],ret=[0,0,0,0,0,0];
    PR.forEach(function(p){if(p.sizes.length!==6)return;for(var j=0;j<6;j++){sold[j]+=p.P.sold[j];ship[j]+=p.P.ship[j];ret[j]+=p.P.ret[j]}});
    var mx=Math.max.apply(0,sold),top=mx?sold.indexOf(mx):-1,tot=IP.sum(sold),hot=-1,hv=0;
    for(var j=0;j<6;j++)if(ship[j]>=IP.MIN_SHIP&&ret[j]/ship[j]>hv){hv=ret[j]/ship[j];hot=j}
    $('#pb-szsub').textContent=top>=0?IP.SZ[top]+' sells most'+(hot>=0&&hv?' · '+IP.SZ[hot]+' comes back most':''):'';
    $('#pb-sz').innerHTML=IP.SZ.map(function(s,j){var r=ship[j]?ret[j]/ship[j]:0;
      return '<tr class="'+(j===top?'top':'')+'"><td>'+s+'</td><td>'+fmt(sold[j])+' <span class="muted">· '+(tot?Math.round(sold[j]/tot*100):0)+'%</span></td><td class="bar"><span class="pa-bar"><i style="--w:'+(mx?sold[j]/mx*100:0)+'%"></i></span></td><td class="'+(j===hot&&hv?'r':'')+'">'+(ship[j]<IP.MIN_SHIP?'<span class="muted">too few</span>':ret[j]+' of '+ship[j]+' · '+Math.round(r*100)+'%')+'</td></tr>'}).join('');
  }

  var sort=$('.pb-tools .pv2-sort'),sind=$('.pv2-sind',sort);
  function moveInd(){var b=$('[aria-pressed="true"]',sort);if(!b||!b.offsetWidth)return;sind.style.left=b.offsetLeft+'px';sind.style.width=b.offsetWidth+'px'}
  function setView(v){st.view=v;$$('button',sort).forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.s===v))});moveInd();rows();pane()}
  sort.addEventListener('click',function(e){var b=e.target.closest('button');if(b&&b.dataset.s!==st.view)setView(b.dataset.s)});
  function select(p,from){st.sel=p;
    if(wide.matches){pane();$$('.pb-row').forEach(function(r){r.toggleAttribute('aria-current',r.dataset.id===p.id);if(r.dataset.id===p.id)r.setAttribute('aria-current','true')});$('#pb-pane').scrollTop=0}
    else U.open(U.detail(p,st.view),from)}
  document.addEventListener('click',function(e){
    var r=e.target.closest('.pb-row');if(r){select(IP.byId(r.dataset.id),r);return}
    var g=e.target.closest('[data-g]');if(g){st.f=st.f===g.dataset.g?'all':g.dataset.g;glance();rows();return}
    if(e.target.closest('[data-clear]')){st.f='all';st.q='';$('#pb-q').value='';glance();rows();return}
    var c=e.target.closest('[data-ip-rank]');if(c){var k=c.dataset.ipRank;setView(k);
      if(U.isOpen()&&st.sel){var sh=U.sheetEl(),y=sh.scrollTop;sh.innerHTML=U.detail(st.sel,k);sh.scrollTop=y}
      var nb=(U.isOpen()?U.sheetEl():$('#pb-pane')).querySelector('[data-ip-rank="'+k+'"]');if(nb)nb.focus({preventScroll:true})}
  });
  var qt;$('#pb-q').addEventListener('input',function(e){clearTimeout(qt);qt=setTimeout(function(){st.q=e.target.value;rows()},120)});
  wide.addEventListener('change',function(){if(wide.matches)U.close();rows();pane()});

  function render(){IP.compute(U.perKey());glance();rows();pane();sizes();
    if(U.isOpen()&&st.sel){var sh=U.sheetEl(),y=sh.scrollTop;sh.innerHTML=U.detail(st.sel,st.view);sh.scrollTop=y}}
  document.addEventListener('per:change',render);
  $('#pb-count').textContent='Every product in your Shopify store, ranked';
  var pid=U.params.get('p');if(pid&&IP.byId(pid))st.sel=IP.byId(pid);
  render();moveInd();addEventListener('resize',moveInd);if(document.fonts)document.fonts.ready.then(moveInd);
  if(pid&&st.sel&&!wide.matches)setTimeout(function(){select(st.sel)},200);
})();
</script>
</body>
</html>
