<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Products · Cards</title>
<!--@HEADFONTS-->
<style>
/*@BASECSS*/
/*@PANELCSS*/
/*@TABSCSS*/
/*@NAVCSS*/
/*@PV2CSS*/
/*@COMMONCSS*/
/* ===== Products A — card gallery ===== */
.pa-att{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.pa-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-top:1px solid var(--pv2-line);width:100%;text-align:left;border-radius:10px;transition:background .2s}
.pa-row:hover{background:var(--pv2-bg2)}
.pa-att > .pa-row:nth-child(-n+2){border-top:0}
.pa-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.pa-row > span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pa-row b{font-size:14.5px;font-weight:600;line-height:1.35}
.pa-row small{font-size:13px;color:var(--pv2-mut);line-height:1.35}
.pa-go{font-size:13px;font-weight:600;color:var(--pv2-acc);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pa-row:hover .pa-go svg{transform:translateX(3px)}.pa-go svg{transition:transform .2s}
@media (max-width:760px){.pa-att{grid-template-columns:minmax(0,1fr)}.pa-att > .pa-row:nth-child(2){border-top:1px solid var(--pv2-line)}}

.pa-cat{container-type:inline-size}
.pa-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.pa-tools .ip-search{flex:1 1 280px}
.pa-tools .pv2-sort{flex:none}
.pa-chips{margin-bottom:18px}
.pa-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@container (max-width:1060px){.pa-cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container (max-width:640px){.pa-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.pa-cards .pv2-card{text-align:left}
.pa-cards .pv2-sw{height:108px}
.pa-cards .pv2-mv.u{color:var(--pv2-mut);font-size:18px;font-weight:600}
.pa-cards .pv2-ptag.n{color:#e3dcef}
.pa-cards .pv2-strip.one{grid-template-columns:minmax(0,1fr)}
.pa-cards .pv2-strip.one .pv2-sz span{font-size:12px}
@container (max-width:640px){.pa-cards .pv2-card{padding:10px}.pa-cards .pv2-sw{height:92px}.pa-cards .pv2-mv{font-size:18px}.pa-cards .pv2-mv.u{font-size:16px}.pa-cards .pv2-nm{font-size:13.5px}.pa-cards .pv2-sub{font-size:12px}}
.pa-cards .pv2-card > *{min-width:0}
@container (max-width:520px){
  .pa-cards{grid-template-columns:minmax(0,1fr);gap:10px}
  .pa-cards .pv2-card{display:grid;grid-template-columns:108px minmax(0,1fr);column-gap:14px;grid-template-areas:"sw nm" "sw mk" "sw mv" "sw sub" "st st" "cap cap";padding:12px;align-items:start}
  .pa-cards .pv2-sw{grid-area:sw;height:auto;min-height:112px;align-self:stretch}
  .pa-cards .pv2-nm{grid-area:nm;margin-top:0;min-height:0;font-size:14px}
  .pa-cards .pv2-mk{grid-area:mk;margin-top:4px}.pa-cards .pv2-mv{grid-area:mv;font-size:20px}.pa-cards .pv2-sub{grid-area:sub;font-size:12.5px}
  .pa-cards .pv2-ptag{top:auto;bottom:7px;left:7px;right:auto}.pa-cards .pv2-sw:has(.pv2-ptag) .pv2-left{bottom:36px}
  .pa-cards .pv2-strip{grid-area:st}.pa-cards .pv2-cap{grid-area:cap}
}
.pa-foot{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--pv2-mut)}

/* sizes across every product */
.pa-szs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.pa-sz{display:flex;flex-direction:column;gap:6px;padding:14px 12px;border-radius:14px;background:var(--pv2-bg2);border:1px solid var(--pv2-line);min-width:0}
.pa-sz > span{font-size:13px;font-weight:600;color:var(--pv2-mut)}
.pa-sz > b{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.pa-sz > b small{font-size:12.5px;font-weight:500;color:var(--pv2-mut);margin-left:4px;letter-spacing:0}
.pa-bar{height:6px;border-radius:99px;background:var(--pv2-track);overflow:hidden}
.pa-bar i{display:block;height:100%;width:var(--w);border-radius:99px;background:linear-gradient(90deg,#550da6,#a275e0)}
.pa-sz em{font-style:normal;font-size:12.5px;color:var(--pv2-mut);white-space:nowrap}
.pa-sz em.r{color:var(--pv2-bad);font-weight:600}
.pa-sz.top{border-color:var(--pv2-acc);background:color-mix(in srgb,var(--pv2-acc) 12%,var(--pv2-bg2))}
.pa-sz.hot{border-color:color-mix(in srgb,var(--pv2-bad) 60%,transparent)}
.pa-szsum{font-size:14px;line-height:1.5;margin-bottom:16px}
.pa-szsum b{font-weight:600}
.pa-szsum .r{color:var(--pv2-bad)}
@media (max-width:760px){.pa-szs{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.pa-sz{padding:12px 10px}.pa-sz > b{font-size:19px}}
</style>
<script>
/*@PERJS*/
</script>
</head>
<body data-page="products">
<!--@SPRITE-->
<div class="app">
<!--@SIDE-->
  <div class="content">
  <main>
<!--@NAVTOP-->
    <div class="pv2 ip" id="ip">
      <header class="ip-head">
        <div><h1>Products</h1><p id="pa-count">13 products in your Shopify store</p></div>
        <div class="ip-hl"><a class="ip-link" href="#" data-ip-go="inventory">Inventory <svg class="ip-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
      </header>

      <section class="pv2-panel" aria-labelledby="pa-att-h">
        <div class="pv2-ph"><h3 id="pa-att-h">Worth a look</h3></div>
        <div class="pa-att" id="pa-att"></div>
      </section>

      <section class="pv2-panel pa-cat" aria-labelledby="pa-cat-h" id="pa-cat">
        <div class="pv2-ph"><h3 id="pa-cat-h">All products</h3></div>
        <div class="pa-tools">
          <label class="ip-search"><svg class="ip-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <span class="sr">Search products</span><input type="search" id="pa-q" placeholder="Search name, colour or type" autocomplete="off"></label>
          <div class="pv2-sort" role="group" aria-label="Sort products by"><span class="pv2-sind" aria-hidden="true"></span>
            <button type="button" data-s="rev" aria-pressed="true">Revenue</button><button type="button" data-s="profit" aria-pressed="false">Profit</button><button type="button" data-s="margin" aria-pressed="false">Margin</button><button type="button" data-s="units" aria-pressed="false">Units</button><button type="button" data-s="ret" aria-pressed="false">Returns</button>
          </div>
        </div>
        <div class="ip-chips ip-swipe pa-chips" role="group" aria-label="Show" id="pa-chips"></div>
        <p class="sr" aria-live="polite" id="pa-live"></p>
        <div class="pa-cards" id="pa-cards"></div>
        <div class="pa-foot"><span>Tap a product for sizes, returns and what to do</span></div>
      </section>

      <section class="pv2-panel" aria-labelledby="pa-sz-h">
        <div class="pv2-ph"><h3 id="pa-sz-h">Sizes across all products</h3></div>
        <p class="pa-szsum" id="pa-szsum"></p>
        <div class="pa-szs" id="pa-szs"></div>
      </section>
    </div>
  </main>
  </div>
</div>
<!--@DOCK-->
<script>
/*@NAVJS*/
</script>
<script>
/*@DATAJS*/
/*@COMMONJS*/
/* ===== Products A behaviour ===== */
(function(){
  var U=IPU,$=U.$,$$=U.$$,fmt=IP.fmt,PR=IP.PR;
  var st={view:'rev',f:'all',q:'',open:null};
  var ICON={cost:'<path d="M12 3v18M17 7H9.5a3 3 0 0 0 0 6h5a3 3 0 0 1 0 6H6"/>',ret:'<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',dead:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',stock:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>'};
  function ico(k){return '<svg class="ip-i" viewBox="0 0 24 24" aria-hidden="true">'+ICON[k]+'</svg>'}
  /* filters — counts follow the date period */
  var F={
    all:{l:'All',t:function(){return true}},
    nocost:{l:'No cost',c:'var(--pv2-warn)',t:function(p){return !!p.costMissing}},
    lowm:{l:'Low margin',c:'var(--pv2-warn)',t:function(p){return p.P.margin!=null&&p.P.u&&p.P.margin<35}},
    ret:{l:'High returns',c:'var(--pv2-bad)',t:function(p){return p.P.s>=IP.MIN_SHIP&&p.P.rate>=15}},
    low:{l:'Low or sold out',c:'var(--pv2-bad)',t:function(p){return p.stock.some(function(x){return x!=null&&x<=IP.LOW})}},
    dead:{l:'Not selling',c:'var(--pv2-mut)',t:function(p){return IP.DEAD.indexOf(p)>=0}}
  };
  var HELP={nocost:'No unit cost in Shopify — profit unknown',lowm:'Under 35% kept after the cost of the item',ret:'15% or more came back',low:'A size has 4 or fewer left',dead:'At most 1 sale in 30 days'};
  function matches(p){var q=st.q.trim().toLowerCase();return F[st.f].t(p)&&(!q||(p.n+' '+p.col+' '+p.type).toLowerCase().indexOf(q)>=0)}

  /* ---- worth a look ---- */
  function attention(){
    var rows=[],P=IP.PER[U.perKey()];
    var nc=PR.filter(F.nocost.t);
    if(nc.length)rows.push({c:'var(--pv2-warn)',i:'cost',b:nc.length+' products have no cost in Shopify',s:'Their profit is unknown — '+nc.map(function(p){return p.main.split(' ')[0]}).join(' and '),go:'Show',a:'f:nocost'});
    var worst=null;PR.forEach(function(p){p.P.ship.forEach(function(sh,j){if(sh<IP.MIN_SHIP||!p.P.ret[j])return;var r=p.P.ret[j]/sh;if(!worst||r>worst.r)worst={p:p,j:j,r:r}})});
    if(worst)rows.push({c:'var(--pv2-bad)',i:'ret',b:worst.p.main+' · '+worst.p.sizes[worst.j]+' comes back most',s:worst.p.P.ret[worst.j]+' of '+worst.p.P.ship[worst.j]+' returned '+P.phrase+' ('+Math.round(worst.r*100)+'%)',go:'Open',a:'p:'+worst.p.id+':ret'});
    var dead=IP.DEAD;if(dead.length){var cash=dead.reduce(function(a,p){return a+IP.tied(p).cash},0);
      rows.push({c:'var(--pv2-mut)',i:'dead',b:dead.length+' products barely sold in 30 days',s:'At least EGP '+fmt(cash)+' of stock sitting still',go:'Show',a:'f:dead'})}
    var soon=null;PR.forEach(function(p){var pl=IP.plan(p,30,7);if(pl.first&&pl.first.lasts>0&&isFinite(pl.first.lasts)&&(!soon||pl.first.lasts<soon.l))soon={p:p,l:pl.first.lasts,s:pl.first.s}});
    if(soon)rows.push({c:'var(--pv2-acc)',i:'stock',b:soon.p.main+(soon.p.sizes.length>1?' · '+soon.s:'')+' '+IP.when(soon.l),s:'Sooner than a 7-day delivery could land',go:'Plan',a:'i:'+soon.p.id});
    $('#pa-att').innerHTML=rows.map(function(r){return '<button type="button" class="pa-row" data-a="'+r.a+'" style="--c:'+r.c+'"><span class="pa-ic">'+ico(r.i)+'</span><span><b>'+r.b+'</b><small>'+r.s+'</small></span><span class="pa-go">'+r.go+' '+U.ARW+'</span></button>'}).join('');
  }

  /* ---- cards ---- */
  function chips(){
    $('#pa-chips').innerHTML=Object.keys(F).map(function(k){var n=PR.filter(F[k].t).length;if(k!=='all'&&!n&&st.f!==k)return '';
      return '<button type="button" class="ip-chip" data-f="'+k+'" aria-pressed="'+(st.f===k)+'"'+(HELP[k]?' title="'+HELP[k]+'"':'')+'>'+(F[k].c?'<i class="ip-dot" style="--c:'+F[k].c+'"></i>':'')+F[k].l+'<b>'+n+'</b></button>'}).join('');
  }
  function tag(p){
    if(IP.DEAD.indexOf(p)>=0)return ['n','Not selling'];
    if(p.left===0&&!p.unknownSizes.length)return ['r','Sold out'];
    if(p.costMissing)return ['w','No cost'];
    if(p.unknownSizes.length===p.sizes.length)return ['n','Not tracked'];
    return null}
  function card(p,rank){
    var v=st.view,d=p.P,one=p.sizes.length===1,x=U.val(p,v),unk=(v==='profit'||v==='margin')&&d.profit==null&&d.u,pc=v==='margin'||v==='ret',t=tag(p);
    var mk=v==='ret'?'Returned':U.VIEW[v],mv;
    if(unk)mv='<b class="pv2-mv u">Unknown</b>';
    else if(v!=='ret'&&!d.u&&v!=='units'&&v!=='rev')mv='<b class="pv2-mv u">—</b>';
    else mv='<b class="pv2-mv'+(v==='ret'&&d.rate>=15&&d.s>=IP.MIN_SHIP?' r':'')+'">'+(pc||v==='units'?'':'<small>EGP</small>')+(v==='units'?fmt(x):pc?(v==='ret'&&!d.s?'—':x.toFixed(1)+'%'):fmt(x))+'</b>';
    var sub=v==='ret'?(d.s?'<b>'+d.r+' of '+d.s+'</b> came back':'Nothing shipped')
      :!d.u?(p.lastSale?'Last sale '+p.lastSale:'No sales'):unk?'<b>'+d.u+' sold</b> · needs a cost'
      :v==='units'?(d.margin==null?'EGP '+fmt(d.rev):'EGP '+fmt(d.rev)+' revenue'):'<b>'+fmt(d.u)+' sold</b> · '+(v==='margin'?(d.profit==null?'profit unknown':'EGP '+fmt(d.profit)+' profit'):d.margin==null?'profit unknown':d.margin.toFixed(1)+'% margin');
    var strip,cap,w=IP.worstSize(p),tp=IP.topSize(p);
    if(v==='ret'){strip=p.sizes.map(function(s,j){var sh=d.ship[j],few=sh<IP.MIN_SHIP,r=sh?d.ret[j]/sh:0;return '<div class="pv2-sz'+(j===w?' pv2-top':'')+'" style="--pv2-hc:var(--pv2-bad)"><div class="pv2-t"><i style="--v:'+(!sh?0:few?8:Math.max(8,Math.min(100,r/.5*100)))+'%;--pv2-c:'+(few?'rgba(150,140,170,.28)':IP.rateColor(r))+'"></i></div><span>'+s+'</span></div>'}).join('');
      cap=w>=0?'<b>'+p.sizes[w]+' returns most</b> · '+d.ret[w]+' of '+d.ship[w]:d.r?'Too few to judge a size':'No returns'}
    else{var mx=Math.max.apply(0,d.sold);strip=p.sizes.map(function(s,j){return '<div class="pv2-sz'+(j===tp?' pv2-top':'')+'"><div class="pv2-t"><i style="--v:'+(mx?d.sold[j]/mx*100:0)+'%;--pv2-c:'+(j===tp?'linear-gradient(180deg,#b88cf0,#6a1fc4)':'rgba(162,117,224,.42)')+'"></i></div><span>'+s+'</span></div>'}).join('');
      cap=one?(d.u?'<b>One size</b> · '+d.u+' sold':'One size'):tp>=0?'<b>'+p.sizes[tp]+' sells most</b> · '+Math.round(d.sold[tp]/d.u*100)+'%':'No sales yet'}
    var known=p.stock.map(function(x,j){return [x,j]}).filter(function(a){return a[0]!=null}),mn=known.length?known.sort(function(a,b){return a[0]-b[0]})[0]:null,left='';
    if(mn&&mn[0]<=IP.LOW&&p.left>0&&IP.DEAD.indexOf(p)<0)left='<span class="pv2-left" style="--ul:'+(mn[0]<=1?'#ff8a7a':mn[0]<=2?'#f2c46d':'#a275e0')+'"><i></i>'+(mn[0]?mn[0]+' left · '+p.sizes[mn[1]]:p.sizes[mn[1]]+' sold out')+'</span>';
    return '<button type="button" class="pv2-card" data-id="'+p.id+'" aria-label="'+p.n+'. '+d.u+' sold. Open details."><div class="pv2-sw" style="--c1:'+p.c[0]+';--c2:'+p.c[1]+'">'+(rank?'<span class="pv2-rank">'+rank+'</span>':'')+(t?'<span class="pv2-ptag '+t[0]+'">'+t[1]+'</span>':'')+left+U.DRESS+'</div>'
      +'<div class="pv2-nm">'+p.n+'</div><div class="pv2-mk">'+mk+'</div>'+mv+'<div class="pv2-sub">'+sub+'</div>'
      +'<div class="pv2-strip'+(one?' one':'')+'" aria-hidden="true">'+strip+'</div><div class="pv2-cap'+(v==='ret'?' r':'')+'">'+cap+'</div></button>';
  }
  function cards(animate){
    var box=$('#pa-cards'),first={};
    if(animate&&!U.reduce)$$('.pv2-card',box).forEach(function(c){first[c.dataset.id]=c.getBoundingClientRect()});
    var all=U.sorted(PR,st.view),list=all.filter(matches);
    box.innerHTML=list.length?list.map(function(p){return card(p,U.rankOf(st.view,p))}).join('')
      :'<p class="ip-empty" style="grid-column:1/-1">No products match'+(st.q?' “'+st.q.replace(/</g,'')+'”':'')+'.<button type="button" data-clear>Show all products</button></p>';
    $('#pa-live').textContent=list.length+' products shown';
    if(animate&&!U.reduce)$$('.pv2-card',box).forEach(function(c){var f=first[c.dataset.id];if(!f)return;var l=c.getBoundingClientRect(),dx=f.left-l.left,dy=f.top-l.top;
      if(dx||dy)c.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:550,easing:'cubic-bezier(.2,.8,.2,1)'})});
  }

  /* ---- sizes across all products ---- */
  function sizes(){
    var sold=[0,0,0,0,0,0],ship=[0,0,0,0,0,0],ret=[0,0,0,0,0,0];
    PR.forEach(function(p){if(p.sizes.length!==6)return;for(var j=0;j<6;j++){sold[j]+=p.P.sold[j];ship[j]+=p.P.ship[j];ret[j]+=p.P.ret[j]}});
    var tot=IP.sum(sold),mx=Math.max.apply(0,sold),top=sold.indexOf(mx),hot=-1,hv=0;
    for(var j=0;j<6;j++){if(ship[j]>=IP.MIN_SHIP&&ret[j]/ship[j]>hv){hv=ret[j]/ship[j];hot=j}}
    $('#pa-szsum').innerHTML=tot?'<b>'+IP.SZ[top]+' sells most</b> — '+Math.round(mx/tot*100)+'% of '+fmt(tot)+' pieces.'+(hot>=0&&hv>0?' <span class="r"><b>'+IP.SZ[hot]+' comes back most</b></span> — '+ret[hot]+' of '+ship[hot]+' shipped ('+Math.round(hv*100)+'%).':''):'No sales in this period.';
    $('#pa-szs').innerHTML=IP.SZ.map(function(s,j){var r=ship[j]?ret[j]/ship[j]:0;
      return '<div class="pa-sz'+(j===top&&tot?' top':'')+(j===hot&&hv>0?' hot':'')+'"><span>'+s+'</span><b>'+fmt(sold[j])+'<small>sold</small></b><span class="pa-bar"><i style="--w:'+(mx?sold[j]/mx*100:0)+'%"></i></span><em class="'+(j===hot&&hv>0?'r':'')+'">'+(ship[j]<IP.MIN_SHIP?'too few shipped':Math.round(r*100)+'% returned')+'</em></div>'}).join('');
  }

  /* ---- detail ---- */
  function openDetail(p,from){st.open=p;U.open(U.detail(p,st.view),from);$$('.pv2-card').forEach(function(c){c.classList.toggle('pv2-sel',c.dataset.id===p.id)})}
  document.addEventListener('ip:sheet',function(e){if(!e.detail.open){st.open=null;$$('.pv2-card.pv2-sel').forEach(function(c){c.classList.remove('pv2-sel')})}});

  /* ---- sort pills ---- */
  var sort=$('.pa-tools .pv2-sort'),sind=$('.pv2-sind',sort);
  function moveInd(){var b=$('[aria-pressed="true"]',sort);if(!b||!b.offsetWidth)return;sind.style.left=b.offsetLeft+'px';sind.style.width=b.offsetWidth+'px'}
  function setView(v,anim){st.view=v;$$('button',sort).forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.s===v))});moveInd();cards(anim)}
  sort.addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.dataset.s===st.view)return;setView(b.dataset.s,true)});

  document.addEventListener('click',function(e){
    var c=e.target.closest('.pa-cards .pv2-card');if(c){openDetail(IP.byId(c.dataset.id),c);return}
    var f=e.target.closest('[data-f]');if(f){st.f=f.dataset.f;chips();cards(true);return}
    if(e.target.closest('[data-clear]')){st.f='all';st.q='';$('#pa-q').value='';chips();cards(false);return}
    var r=e.target.closest('.ip-sheet [data-ip-rank]');if(r&&st.open){var k=r.dataset.ipRank;setView(k,true);var sh=U.sheetEl(),y=sh.scrollTop;sh.innerHTML=U.detail(st.open,k);sh.scrollTop=y;var nb=sh.querySelector('[data-ip-rank="'+k+'"]');if(nb)nb.focus({preventScroll:true});return}
    var a=e.target.closest('.pa-row');if(a){var x=a.dataset.a.split(':');
      if(x[0]==='f'){st.f=x[1];chips();cards(false);$('#pa-cat').scrollIntoView({behavior:U.reduce?'auto':'smooth',block:'start'})}
      else if(x[0]==='p'){if(x[2])setView(x[2],false);openDetail(IP.byId(x[1]),a)}
      else if(x[0]==='i')U.go('inventory','p='+x[1]);}
  });
  var qt;$('#pa-q').addEventListener('input',function(e){clearTimeout(qt);qt=setTimeout(function(){st.q=e.target.value;cards(false)},120)});

  function render(){IP.compute(U.perKey());attention();chips();cards(false);sizes();if(st.open&&U.isOpen()){var sh=U.sheetEl(),y=sh.scrollTop;sh.innerHTML=U.detail(st.open,st.view);sh.scrollTop=y}}
  document.addEventListener('per:change',render);
  render();moveInd();
  addEventListener('resize',moveInd);if(document.fonts)document.fonts.ready.then(moveInd);
