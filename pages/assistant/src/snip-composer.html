<div class="as-cwrap" data-as-cwrap>
  <form class="as-composer" data-as-form>
    <ul class="as-att" data-as-att hidden></ul>
    <label class="sr" for="as-in">Message the assistant</label>
    <textarea id="as-in" rows="1" placeholder="Ask about sales, ads, stock or shipping…" autocomplete="off" data-as-in></textarea>
    <div class="as-cbar">
      <label class="as-cb" title="Attach photos or videos"><svg class="as-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 11.1l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg><span class="sr">Attach photos or videos</span><input type="file" class="sr" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime" multiple data-as-file></label>
      <span class="as-hint">Enter to send · Shift + Enter for a new line</span>
      <button type="submit" class="as-send" data-as-send aria-label="Send"><svg class="as-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    </div>
  </form>
  <p class="as-fine">Changes to your ads always wait for your OK.</p>
</div>
